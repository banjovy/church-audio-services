[project]
name = "captioning"
version = "0.1.0"
description = "Church AV real-time captioning system"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper==1.1.0",
    "sounddevice==0.5.1",
    "numpy==2.1.3",
    "scipy>=1.11.0",
    "av>=12.0.0",
    "aiohttp==3.11.11",
    "qrcode==8.0",
    "Pillow==11.1.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "better-profanity==0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[project.scripts]
captioning = "captioning.main:main"
